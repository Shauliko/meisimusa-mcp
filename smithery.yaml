# Smithery.ai listing config. Lets users install meisimusa-mcp from the
# Smithery directory with one click. stdio launch via the published npm package.
# Docs: https://smithery.ai/docs
startCommand:
  type: stdio
  # The retail travel eSIM flow needs no key. The tools on your own numbers
  # (list, read, wait, send, buy) need your MeiSIM API key.
  configSchema:
    type: object
    properties:
      MEISIMUSA_API_KEY:
        type: string
        title: MeiSIM API key (optional)
        description: Needed for the tools on your own numbers. Leave blank for the retail travel eSIM flow.
      MEISIMUSA_API_BASE:
        type: string
        title: API base URL (optional)
        default: https://meisimusa-backend.vercel.app
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/cli.js'],
      env: {
        ...(config.MEISIMUSA_API_KEY ? { MEISIMUSA_API_KEY: config.MEISIMUSA_API_KEY } : {}),
        ...(config.MEISIMUSA_API_BASE ? { MEISIMUSA_API_BASE: config.MEISIMUSA_API_BASE } : {})
      }
    })
build:
  dockerfile: Dockerfile   # optional; only used by Smithery's hosted runner
